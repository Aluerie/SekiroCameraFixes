[package]
name = "sekiro_camera_fixes"
version = "0.1.0"
edition = "2024"
description = "Sekiro: Shadows Die Twice native mod (Mod Engine 3) that disables camera auto-rotation on movement and the camera reset on lock-on."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[profile.release]
# A panic only ends the mod's own worker thread instead of taking the game down.
panic = "unwind"
lto = true
codegen-units = 1
strip = true
